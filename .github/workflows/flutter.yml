name: Flutter analysis and tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.0'
          cache: true
      - name: Initialize missing platform scaffolding
        run: flutter create --platforms=android,ios --project-name kalori_360 .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Verify Android dependencies and buildability
        run: flutter doctor -v
      - name: Build Android APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: kalori360-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk